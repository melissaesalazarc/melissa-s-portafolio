  .demo-erp { position: fixed; inset: 0; display: grid; grid-template-rows: 64px 1fr; }
  .demo-erp__top { background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 18px; padding: 0 32px; }
  .demo-erp__top i { display: block; height: 12px; width: 120px; border-radius: 6px; background: #d9e2dd; }

  .demo-erp__grid { padding: 28px 32px; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 150px; gap: 20px; }
  .demo-erp__grid i { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; }
  .demo-erp__grid i:nth-child(5) { grid-column: span 3; grid-row: span 2; }
  .demo-erp__grid i:nth-child(6) { grid-row: span 2; }
  html.dark body { background: #0f1115; }
  html.dark .demo-erp__top, html.dark .demo-erp__grid i { background: #1c2230; border-color: #2d3545; }
</style>
